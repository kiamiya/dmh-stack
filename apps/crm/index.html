<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DMH CRM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap"
    />
    <script>
      // Anti-flash : applique le thème avant le premier rendu React (voir
      // src/lib/theme.ts / src/hooks/useTheme.ts pour la logique complète,
      // dupliquée ici en minimal car ce script doit rester synchrone/inline).
      (function () {
        try {
          var stored = localStorage.getItem("dmh-crm-theme");
          var theme = stored === "light" || stored === "dark" ? stored : "system";
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = theme === "system" ? (prefersDark ? "dark" : "light") : theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
